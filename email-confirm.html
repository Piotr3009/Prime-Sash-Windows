    <title>Confirming Email - Prime Sash Windows</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jost', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #0A1628 0%, #142640 100%);
            color: white;
        }
        .card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-header {
            background: #0A1628;
            padding: 30px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .silver-line {
            width: 180px;
            height: 1px;
            background: linear-gradient(to right,
                transparent 0%, #707068 15%, #B8B8AE 40%,
                #D4D4C8 50%, #B8B8AE 60%, #707068 85%, transparent 100%);
        }
        .logo-text {
            font-family: 'Jost', sans-serif;
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: .55em;
            text-transform: uppercase;
            line-height: 1.25;
            display: block;
            background: linear-gradient(105deg,
                #707070 0%, #A8A8A8 12%, #D0D0D0 22%,
                #F0F0F0 32%, #FFFFFF 42%, #F8F8F8 50%,
                #FFFFFF 58%, #F0F0F0 68%, #D0D0D0 78%,
                #A8A8A8 88%, #707070 100%);
            background-size: 260% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 5s linear infinite;
        }
        .gold-accent {
            height: 3px;
            background: linear-gradient(to right, #D4AF37, #C5A028, #D4AF37);
        }
        .card-body {
            padding: 40px;
            text-align: center;
        }
        .spinner {
            border: 4px solid #eee;
            border-top: 4px solid #0A1628;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes shimmer {
            0% { background-position: 100% 50%; }
            100% { background-position: -100% 50%; }
        }
        h1 {
            font-family: 'Jost', sans-serif;
            color: #0A1628;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.1em;
        }
        p {
            color: #666;
            font-size: 0.95rem;
        }
    </style>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
    <div class="card">
        <div class="auth-header">
            <div class="silver-line"></div>
            <span class="logo-text">Prime Sash</span>
            <span class="logo-text">Windows</span>
            <div class="silver-line"></div>
        </div>
        <div class="gold-accent"></div>
        <div class="card-body">
            <h1>Confirming Your Email...</h1>
            <div class="spinner"></div>
            <p>Please wait while we verify your email address.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js?v=2"></script>

    <script>
        async function handleConfirmation() {
            const container = document.querySelector('.card-body');
            const h1 = container.querySelector('h1');
            const p = container.querySelector('p');
            const spinner = container.querySelector('.spinner');

            function showSuccess() {
                spinner.style.display = 'none';
                h1.innerText = 'Email Confirmed!';
                h1.style.color = '#4caf50';
                p.innerText = 'Redirecting to home...';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            }

            function showError(msg) {
                spinner.style.display = 'none';
                h1.innerText = 'Verification Issue';
                h1.style.color = '#e74c3c';
                p.innerHTML = `${msg}<br><br>
                <small>Tip: Check if your device clock is synced correctly.</small><br><br>
                <a href="login.html" style="color: gold; text-decoration: underline;">Go to Login</a>`;
            }

            // 1. Nasłuchuj zmian stanu (automatyczne logowanie przez Supabase)
            const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' || event === 'USER_UPDATED') {
                    showSuccess();
                }
            });

            // 2. Ręczna weryfikacja
            try {
                // Sprawdź czy użytkownik już jest zalogowany
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    showSuccess();
                    return;
                }

                const urlParams = new URLSearchParams(window.location.search);
                const tokenHash = urlParams.get('token_hash');
                const type = urlParams.get('type');
                const errorCode = urlParams.get('error_code');
                const errorDescription = urlParams.get('error_description');

                // Obsługa błędów z URL
                if (errorCode) throw new Error(errorDescription || 'Link invalid');

                // Nowy Flow (PKCE)
                if (tokenHash && type) {
                    const { error } = await supabaseClient.auth.verifyOtp({
                        token_hash: tokenHash,
                        type: type,
                    });
                    if (error) throw error;
                    return;
                }

                // Stary Flow (Hash)
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const accessToken = hashParams.get('access_token');
                
                if (accessToken) {
                    const { error } = await supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: hashParams.get('refresh_token')
                    });
                    if (error) throw error;
                    return;
                }

                // Daj czas bibliotece na przetworzenie
                setTimeout(() => {
                    supabaseClient.auth.getSession().then(({ data }) => {
                        if (!data.session && !tokenHash && !accessToken) {
                            showError('No verification token found. Please try logging in.');
                        }
                    });
                }, 3000);

            } catch (error) {
                console.error(error);
                showError(error.message);
            }
        }

        // Uruchom natychmiast
        document.addEventListener('DOMContentLoaded', handleConfirmation);
    </script>
</body>
</html>
