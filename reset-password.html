    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Prime Sash Windows</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0A1628;
            --secondary-color: #9E9E90;
            --gold: #D4AF37;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0A1628 0%, #142640 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Jost', sans-serif;
        }

        .container {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .auth-header {
            background: #0A1628;
            padding: 30px 40px;
        }

        .logo {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .logo .silver-line {
            width: 180px;
            height: 1px;
            background: linear-gradient(to right,
                transparent 0%, #707068 15%, #B8B8AE 40%,
                #D4D4C8 50%, #B8B8AE 60%, #707068 85%, transparent 100%);
        }

        .logo span {
            font-family: 'Jost', sans-serif;
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: .55em;
            text-transform: uppercase;
            line-height: 1.25;
            display: block;
            background: linear-gradient(105deg,
                #707070 0%, #A8A8A8 12%, #D0D0D0 22%,
                #F0F0F0 32%, #FFFFFF 42%, #F8F8F8 50%,
                #FFFFFF 58%, #F0F0F0 68%, #D0D0D0 78%,
                #A8A8A8 88%, #707070 100%);
            background-size: 260% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 5s linear infinite;
        }

        .gold-accent {
            height: 3px;
            background: linear-gradient(to right, #D4AF37, #C5A028, #D4AF37);
        }

        .auth-body {
            padding: 35px 40px 40px 40px;
        }

        @keyframes shimmer {
            0% { background-position: 100% 50%; }
            100% { background-position: -100% 50%; }
        }

        h2 {
            font-family: 'Playfair Display', serif;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #666;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Jost', sans-serif;
            transition: border 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Jost', sans-serif;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #071020;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
        }

        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .spinner {
            border: 3px solid rgba(10,22,40,0.1);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            text-align: center;
            color: #666;
        }
    </style>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
    <div class="container">
        <div class="auth-header">
            <div class="logo">
                <div class="silver-line"></div>
                <span>Prime Sash</span>
                <span>Windows</span>
                <div class="silver-line"></div>
            </div>
        </div>
        <div class="gold-accent"></div>
        <div class="auth-body">

        <!-- Loading state -->
        <div id="loading-state">
            <div class="spinner"></div>
            <p class="loading-text">Verifying your reset link...</p>
        </div>

        <!-- Reset form (hidden until session verified) -->
        <div id="reset-form" style="display: none;">
            <h2>Set New Password</h2>
            <p class="subtitle">Enter your new password below</p>
            <input type="password" id="new-password" placeholder="New Password (min 6 characters)" required>
            <input type="password" id="confirm-password" placeholder="Confirm New Password" required>
            <button class="btn" id="reset-btn" onclick="resetPassword()">Update Password</button>
            <div id="reset-message" class="message"></div>
        </div>

        <!-- Error state -->
        <div id="error-state" style="display: none;">
            <h2 style="color: #c62828;">Link Expired</h2>
            <p class="subtitle">This password reset link is invalid or has expired. Please request a new one.</p>
            <a href="login.html" class="btn" style="display: block; text-align: center; text-decoration: none;">Go to Login</a>
        </div>

        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
        </div><!-- /auth-body -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>

    <script>
        let sessionReady = false;

        async function init() {
            const loadingEl = document.getElementById('loading-state');
            const formEl = document.getElementById('reset-form');
            const errorEl = document.getElementById('error-state');

            // Listen for PASSWORD_RECOVERY event
            const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'PASSWORD_RECOVERY') {
                    sessionReady = true;
                    loadingEl.style.display = 'none';
                    formEl.style.display = 'block';
                }
                if (event === 'SIGNED_IN' && !sessionReady) {
                    sessionReady = true;
                    loadingEl.style.display = 'none';
                    formEl.style.display = 'block';
                }
            });

            // Also try to get session from URL hash
            try {
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const accessToken = hashParams.get('access_token');
                const type = hashParams.get('type');

                if (accessToken && type === 'recovery') {
                    const { error } = await supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: hashParams.get('refresh_token')
                    });
                    if (error) throw error;
                    sessionReady = true;
                    loadingEl.style.display = 'none';
                    formEl.style.display = 'block';
                    return;
                }

                // Check query params (PKCE flow)
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                if (code) {
                    const { error } = await supabaseClient.auth.exchangeCodeForSession(code);
                    if (error) throw error;
                    sessionReady = true;
                    loadingEl.style.display = 'none';
                    formEl.style.display = 'block';
                    return;
                }

            } catch (error) {
                console.error('Session error:', error);
            }

            // Timeout - if no session after 5 seconds, show error
            setTimeout(() => {
                if (!sessionReady) {
                    loadingEl.style.display = 'none';
                    errorEl.style.display = 'block';
                }
            }, 5000);
        }

        async function resetPassword() {
            const password = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;
            const messageEl = document.getElementById('reset-message');
            const btn = document.getElementById('reset-btn');

            if (!password || !confirm) {
                showMessage(messageEl, 'Please fill in both fields', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage(messageEl, 'Password must be at least 6 characters', 'error');
                return;
            }

            if (password !== confirm) {
                showMessage(messageEl, 'Passwords do not match', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating...';

            try {
                const { error } = await supabaseClient.auth.updateUser({
                    password: password
                });

                if (error) throw error;

                showMessage(messageEl, '✅ Password updated successfully! Redirecting to login...', 'success');

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                console.error('Password update error:', error);
                showMessage(messageEl, error.message || 'Failed to update password', 'error');
                btn.disabled = false;
                btn.textContent = 'Update Password';
            }
        }

        function showMessage(element, message, type) {
            element.textContent = message;
            element.className = 'message ' + type;
            element.style.display = 'block';
        }

        // Enter key support
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('confirm-password').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') resetPassword();
            });
        });

        // Run
        init();
    </script>
</body>
</html>
